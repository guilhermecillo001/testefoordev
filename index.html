<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foordev</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f6f6f6;
      color: #1d1d1d;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 4rem;
      background: white;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #1d1d1d;
      font-weight: 500;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 90vh;
      background: linear-gradient(to right, #0b1543 33%, transparent 0%);
      overflow: hidden;
    }

    .hero-content {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 1200px;
      padding: 4rem 2rem;
      gap: 4rem;
    }

    .circle-container {
      position: relative;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #f1f1f1, #ccc);
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .circle-container img {
      max-width: 160px;
    }

    .glass-box {
      position: absolute;
      left: 8%;
      top: 10%;
      width: 84%;
      height: 80%;
      border-radius: 180px 0 180px 0;
      background: rgba(255,255,255,0.2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1;
    }

    .text-box {
      z-index: 3;
      max-width: 500px;
    }

    .text-box h1 {
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #1d1d1d;
    }

    .text-box h1 strong {
      color: #0b1543;
    }

    .text-box p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
      margin-bottom: 2rem;
    }

    .text-box a {
      background: #0b1543;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .text-box a:hover {
      background: #0d1c60;
    }
  </style>
</head>
<body>
  <header>
    <img src="" alt="Logo Foordev" width="140" />
    <nav>
      <a href="#">Início</a>
      <a href="#">Projetos</a>
      <a href="#">Sobre</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <section class="hero">
    <div class="glass-box"></div>
    <div class="hero-content">
      <div class="circle-container">
        <img src="img/logoo.png" alt="Logo Foordev" />
      </div>
      <div class="text-box">
        <h1>I’m <strong>Foordev</strong><br>Expert em soluções digitais</h1>
        <p>Foordev é uma empresa especializada na criação de landing pages profissionais, sistemas web e sites modernos. Nosso foco é ajudar você a destacar sua marca no ambiente digital.</p>
        <a href="#">Ver Projetos →</a>
      </div>
    </div>
  </section>
</body>
</html>
